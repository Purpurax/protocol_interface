[package]
name = "protocol_interface"
version = "0.1.0"
edition = "2024"
default-run = "web"

[dependencies]
protocol_lib = { path = "../protocol_lib" }
# actix-web = "4.14.0"
# serde = { version = "1.0.228", features = ["derive"] }
dioxus = { version = "0.7.1", features = ["router"] }
dioxus-icons = "0.1.0"
reqwest = { version = "0.13.4", features = ["json"] }
# dioxus-charts = "0.4.0"
# chrono = { version = "0.4.43", features = ["wasmbind"] }
# dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
# time = { version = "0.3.53", features = ["wasm-bindgen", "macros"] }
# serde_json = "1.0.149"
# urlencoding = "2.1.3"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[[bin]]
name = "protocol"
path = "src/main.rs"

[[bin]]
name = "web"
path = "src/main_web.rs"

[[bin]]
name = "server"
path = "src/main_server.rs"
